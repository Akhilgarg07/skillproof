# Copy to .github/workflows/skillproof.yml in your skill's repository.
# Add your API key as a repository secret (Settings > Secrets and variables > Actions).
name: skillproof

on:
  pull_request:
    paths: ["my-skill/**"]  # only when the skill or its evals change

permissions:
  contents: read
  pull-requests: write  # to comment the results

jobs:
  skillproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: akhilgarg07/skillproof@v0  # pin a release tag once one exists
        with:
          path: my-skill
          trials: "10"
          max-cost: "10"  # fail instead of running if the estimate is above $10
          min-lift: "0"  # fail the check if the skill makes things worse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # claude-code runner
          # CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}       # codex runner
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}      # openai judge / runner
