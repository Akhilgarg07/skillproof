[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skilltest"
version = "0.1.0.dev0"
description = "pytest for agent skills: prove your skill actually works."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Akhil Garg" }]
keywords = ["agent-skills", "evals", "claude-code", "codex", "llm", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skilltest = "skilltest.cli:app"

[project.urls]
Homepage = "https://github.com/akhilgarg07/skilltest"

[tool.hatch.build.targets.wheel]
packages = ["src/skilltest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Reports use typographic dashes and minus signs on purpose.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
