[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skillproof"
dynamic = ["version"]  # read from src/skillproof/__init__.py (0.1.0)
description = "pytest for agent skills: prove your skill actually works."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Akhil Garg" }]
keywords = ["agent-skills", "evals", "claude-code", "codex", "llm", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "claude-agent-sdk>=0.2.168",  # claude-code runner (bundles the Claude Code CLI)
  "anthropic>=1.15",  # Claude judge
  "openai>=3.0",  # openai-compatible runner and OpenAI judge
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
skillproof = "skillproof.cli:main"

[project.urls]
Homepage = "https://github.com/akhilgarg07/skillproof"
Issues = "https://github.com/akhilgarg07/skillproof/issues"
Source = "https://github.com/akhilgarg07/skillproof"

[tool.hatch.version]
path = "src/skillproof/__init__.py"  # the single place the version is set

[tool.hatch.build.targets.wheel]
packages = ["src/skillproof"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Reports use typographic dashes and minus signs on purpose.
ignore = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
